<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sultan's Job Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky status bar, pipeline counters, filter row, then job rows styled like rack asset tags */
:root{
  --bg:#f3f5f6; --surface:#fff; --line:#d8dee2; --fg:#16212a; --muted:#5b6a75;
  --accent:#0f6b73; --accent-soft:#e1f0f1; --new:#c2410c;
  --strong:#1c7c4a; --good:#1d5fbf; --stretch:#a36a00; --closed:#9a3b3b;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1519; --surface:#172027; --line:#2a3842; --fg:#e4eaee; --muted:#95a5b0;
  --accent:#4fb8bf; --accent-soft:#16343a; --new:#fb923c;
  --strong:#5cc28a; --good:#6ea4f0; --stretch:#e3a93b; --closed:#e07a7a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between}
h1{font:800 clamp(24px,5vw,34px)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.live{font:500 12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--strong);box-shadow:0 0 0 3px color-mix(in srgb,var(--strong) 25%,transparent)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.stage[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.stage b{display:block;font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.stage span{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 13px var(--body);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
input[type=search],select,textarea,input[type=email]{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 9px}
input[type=search]{flex:1 1 180px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:10px}
.job{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fitc,var(--line));border-radius:6px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.job.closed{opacity:.72;border-left-color:var(--closed)}
.job.fresh{animation:flash 2.4s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--new)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.job.fresh{animation:none}}
.top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.co{font:600 17px/1.3 var(--display);margin:0;min-width:0;overflow-wrap:anywhere}
.co a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.co a:hover{border-color:var(--accent)}
.badges{display:flex;gap:6px;align-items:center}
.tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.tag.new{color:var(--new)} .Strong{color:var(--strong)} .Good{color:var(--good)} .Stretch{color:var(--stretch)} .tag.cl{color:var(--closed)}
.pay{font:600 14px var(--mono);color:var(--strong);white-space:nowrap}
.pay.none{font-weight:500;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 12px var(--mono);color:var(--muted)}
.skills{display:flex;flex-wrap:wrap;gap:4px}
.sk{font-size:12px;padding:1px 8px;border-radius:3px;background:var(--accent-soft);color:var(--fg)}
.sk.gap{background:transparent;border:1px dashed var(--stretch);color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 13px var(--body);padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--bg)}
textarea{width:100%;min-height:50px;resize:vertical}
details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.desc{white-space:pre-wrap;font-size:13px;color:var(--muted);max-height:340px;overflow:auto;margin-top:8px;padding:10px;background:var(--bg);border-radius:5px}
.reason{font-size:13px;color:var(--closed)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:6px}
.login{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:12px}
.login p{margin:0;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.more{justify-self:center}
@media (max-width:560px){.pipe{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="login" id="login" hidden>
    <h1>Sultan's Job Hunt</h1>
    <p>Enter your email and we'll send a sign-in link.</p>
    <form id="loginForm" class="ctl">
      <label for="email" class="muted" style="width:100%">Email</label>
      <input id="email" type="email" required autocomplete="email" style="flex:1">
      <button class="btn primary" type="submit">Send link</button>
    </form>
    <p id="loginMsg" class="muted" role="status"></p>
  </div>

  <div id="main" hidden>
    <header>
      <h1>Sultan's Job Hunt</h1>
      <div class="live"><span class="dot" id="dot"></span><span id="liveText">Connecting…</span>
        <button class="btn" id="signout" type="button">Sign out</button></div>
    </header>
    <div class="pipe" id="pipe" style="margin-top:14px"></div>
    <div class="filters" style="margin-top:14px">
      <div id="lanes" class="filters" role="group" aria-label="Lane"></div>
      <div id="fits" class="filters" role="group" aria-label="Fit"></div>
      <button class="chip" id="floor" aria-pressed="true" title="$85K+ for Anchorage roles">$95K+ only ($85K AK)</button>
      <button class="chip" id="unlisted" aria-pressed="true">Include pay not listed</button>
      <button class="chip" id="tx" aria-pressed="false">Texas only</button>
      <button class="chip" id="ak" aria-pressed="false">Anchorage only</button>
      <select id="sort" aria-label="Sort"><option value="fit">Best fit</option><option value="pay">Highest pay</option><option value="new">Newest</option></select>
      <input type="search" id="q" placeholder="Search company, title, skill…" aria-label="Search">
    </div>
    <p class="muted" id="summary" style="margin:10px 0 0"></p>
    <div class="list" id="list" style="margin-top:10px"></div>
    <button class="btn more" id="more" hidden>Show more</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

// ---- Fill these two in (Supabase → Project Settings → API). Both are safe to publish. ----
const SUPABASE_URL = "https://lqqzfissbdvsoapmplcv.supabase.co";
const SUPABASE_KEY = "sb_publishable_8WGoohT7WAvXuRfr664Dkw_HGoWGUDr";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const STAGES = ["New","Saved","Applied","Interview","Offer"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const safe = (u) => /^https:\/\//.test(u || "") ? u : null;

let postings = new Map(), apps = new Map(), lastRun = null, fresh = new Set();
let stage = "New", lane = "All", fit = "All", tx = false, ak = false, q = "", limit = 60, sortBy = "fit";
let payFloor = 95000, showUnlisted = true; // roles that can pay $95K+/yr ($85K+ in Anchorage)
const AK_RE = /(anchorage|eagle river|chugiak|girdwood|\bjber\b|elmendorf|fort richardson|wasilla|palmer|\balaska\b|,\s*AK\b)/i;
const isAK = (p) => AK_RE.test(p.location || "");
const floorFor = (p) => !payFloor ? 0 : isAK(p) ? 85000 : payFloor;

function statusOf(p) { return apps.get(p.id)?.status || "New"; }
function ago(d) { if (!d) return ""; const h = (Date.now() - new Date(d)) / 36e5; return h < 1 ? "just now" : h < 24 ? `${Math.round(h)}h ago` : `${Math.round(h/24)}d ago`; }

function visible() {
  return [...postings.values()].filter((p) => {
    const st = statusOf(p);
    if (stage === "Closed") { if (p.is_open && st !== "Closed") return false; }
    else if (st !== stage) return false;
    else if (stage === "New" && !p.is_open) return false;
    if (lane !== "All" && p.lane !== lane) return false;
    if (fit !== "All" && p.fit !== fit) return false;
    if (tx && !/\b(TX|Texas)\b/.test(p.location || "")) return false;
    if (ak && !isAK(p)) return false;
    if (payFloor && stage === "New") { if (p.pay_max_yr == null) { if (!showUnlisted) return false; } else if (p.pay_max_yr < floorFor(p)) return false; }
    if (q) { const hay = `${p.company} ${p.title} ${p.location} ${(p.matched||[]).join(" ")}`.toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a, b) => sortBy === "pay" ? payValue(b) - payValue(a) || (b.score ?? 0) - (a.score ?? 0)
      : sortBy === "new" ? new Date(b.first_seen_at) - new Date(a.first_seen_at)
      : (b.score ?? 0) - (a.score ?? 0) || new Date(b.first_seen_at) - new Date(a.first_seen_at));
}
// Yearly value of the low end of the range, so hourly and salaried jobs sort together (hourly x 2080 hrs).
function payValue(p) {
  if (p.pay_max_yr != null) return p.pay_max_yr;
  const m = (p.pay || "").match(/\$([\d,.]+)\s*(K)?/i); if (!m) return -1;
  let n = parseFloat(m[1].replace(/,/g, "")) * (m[2] ? 1000 : 1);
  if (/\/hr|hour/i.test(p.pay) || n < 250) n *= 2080;
  return n;
}
// Companies like Amazon post the same role many times (one per opening). Show one card per role + place.
function grouped(list) {
  const seen = new Map();
  for (const p of list) {
    const k = `${p.company}|${p.title.trim().toLowerCase()}|${(p.location || "").toLowerCase()}`;
    if (seen.has(k)) { const g = seen.get(k); g._dupes++; g._ids.push(p.id); } else seen.set(k, Object.assign(p, { _dupes: 1, _ids: [p.id] }));
  }
  return [...seen.values()];
}

function render() {
  const all = [...postings.values()];
  const floorOk = (p) => !payFloor || (p.pay_max_yr == null ? showUnlisted : p.pay_max_yr >= floorFor(p));
  const counts = Object.fromEntries(STAGES.map((s) => [s, grouped(all.filter((p) => statusOf(p) === s && (s !== "New" || (p.is_open && floorOk(p))))).length]));
  counts.Closed = grouped(all.filter((p) => !p.is_open || statusOf(p) === "Closed")).length;
  $("#pipe").innerHTML = [...STAGES, "Closed"].map((s) =>
    `<button class="stage" data-stage="${s}" aria-pressed="${s === stage}"><b>${counts[s]}</b><span>${s === "New" ? "New matches" : s}</span></button>`).join("");
  const lanes = ["All", ...new Set(all.map((p) => p.lane).filter(Boolean))];
  $("#lanes").innerHTML = lanes.map((l) => `<button class="chip" data-lane="${esc(l)}" aria-pressed="${l === lane}">${esc(l)}</button>`).join("");
  $("#fits").innerHTML = ["All","Strong","Good","Stretch"].map((f) => `<button class="chip" data-fit="${f}" aria-pressed="${f === fit}">${f === "All" ? "Any fit" : f}</button>`).join("");
  $("#tx").setAttribute("aria-pressed", tx); $("#ak").setAttribute("aria-pressed", ak); $("#floor").setAttribute("aria-pressed", !!payFloor); $("#unlisted").setAttribute("aria-pressed", showUnlisted); $("#unlisted").hidden = !payFloor;

  const rows = grouped(visible());
  $("#summary").textContent = `${rows.length} ${rows.length === 1 ? "job" : "jobs"} · sorted by ${{ fit: "fit score", pay: "highest pay", new: "newest" }[sortBy]}`;
  if (!rows.length) {
    $("#list").innerHTML = `<div class="empty">${postings.size ? "Nothing here with these filters." : "No postings yet. The feed checks company job boards every 3 hours."}</div>`;
    $("#more").hidden = true; return;
  }
  $("#list").innerHTML = rows.slice(0, limit).map(card).join("");
  $("#more").hidden = rows.length <= limit;
}

function card(p) {
  const a = apps.get(p.id), st = a?.status || "New", u = safe(p.url);
  const fitVar = { Strong: "--strong", Good: "--good", Stretch: "--stretch" }[p.fit] || "--line";
  const isNew = st === "New" && Date.now() - new Date(p.first_seen_at) < 48 * 36e5;
  return `<article class="job ${p.is_open ? "" : "closed"} ${fresh.has(p.id) ? "fresh" : ""}" style="--fitc:var(${fitVar})" data-id="${p.id}" data-ids="${(p._ids || [p.id]).join(",")}">
    <div class="top">
      <h2 class="co">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(p.company)} · ${esc(p.title)}</a>` : `${esc(p.company)} · ${esc(p.title)}`}</h2>
      <div class="badges">${isNew ? `<span class="tag new">New</span>` : ""}${p.is_open ? "" : `<span class="tag cl">Closed</span>`}
        ${p.fit ? `<span class="tag ${p.fit}">${p.fit} · ${p.score ?? "–"}</span>` : ""}</div>
    </div>
    <div class="pay ${p.pay ? "" : "none"}">${p.pay ? esc(p.pay) : "Pay not listed"}${(() => { const f = isAK(p) ? 85000 : 95000, k = f / 1000; return p.pay_min_yr >= f ? ` · starts above $${k}K` : p.pay_max_yr >= f ? ` · can reach $${k}K+` : ""; })()}</div>
    <div class="meta"><span>${esc(p.location || "")}</span><span>${esc(p.lane || "")}</span>
      ${p._dupes > 1 ? `<span>${p._dupes} openings</span>` : ""}<span>found ${ago(p.first_seen_at)}</span>${p.last_checked_at ? `<span>checked ${ago(p.last_checked_at)}</span>` : ""}</div>
    ${!p.is_open ? `<div class="reason">${esc(p.close_reason || "No longer listed")} · ${ago(p.closed_at)}</div>` : ""}
    ${p.why ? `<div>${esc(p.why)}</div>` : ""}
    <div class="skills">${(p.matched || []).map((m) => `<span class="sk">${esc(m)}</span>`).join("")}${(p.gaps || []).map((g) => `<span class="sk gap" title="Gap">${esc(g)}</span>`).join("")}</div>
    <div class="ctl">
      ${st === "New" ? `<button class="btn primary" data-set="Saved" title="Saves it and queues a tailored resume + cover letter for Monday">Save + make resume</button><button class="btn" data-set="Applied">I applied</button><button class="btn" data-set="Not interested">Not for me</button>`
        : `<label class="muted" for="s-${p.id}">Status</label><select id="s-${p.id}" data-status>${["Saved","Applied","Interview","Offer","Closed","Not interested"].map((s) => `<option ${s === st ? "selected" : ""}>${s}</option>`).join("")}</select>
           ${a?.applied_at ? `<span class="muted">Applied ${esc(a.applied_at)}</span>` : ""}${a?.resume_folder ? `<span class="muted">Resume ready: ${esc(a.resume_folder)}</span>` : st === "Saved" ? `<span class="muted">Resume coming in Monday's scan</span>` : ""}`}
    </div>
    ${st !== "New" ? `<textarea id="n-${p.id}" data-notes placeholder="Notes: recruiter, follow-up date, interview prep…">${esc(a?.notes || "")}</textarea>` : ""}
    ${p.description ? `<details><summary>Full posting</summary><div class="desc">${esc(p.description)}</div></details>` : ""}
  </article>`;
}

async function setStatus(id, status) {
  const prev = apps.get(id);
  const row = { posting_id: id, status, updated_at: new Date().toISOString(), notes: prev?.notes ?? null, resume_folder: prev?.resume_folder ?? null,
    applied_at: status === "Applied" && !prev?.applied_at ? new Date().toISOString().slice(0, 10) : prev?.applied_at ?? null };
  apps.set(id, row); render();
  const { error } = await sb.from("applications").upsert(row);
  if (error) { prev ? apps.set(id, prev) : apps.delete(id); render(); alertBar("Couldn't save that change. Check your connection and try again."); }
}
function alertBar(m) { $("#liveText").textContent = m; }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.stage) { stage = t.dataset.stage; limit = 60; render(); }
  else if (t.dataset.lane) { lane = t.dataset.lane; render(); }
  else if (t.dataset.fit) { fit = t.dataset.fit; render(); }
  else if (t.id === "tx") { tx = !tx; if (tx) ak = false; render(); }
  else if (t.id === "ak") { ak = !ak; if (ak) tx = false; render(); }
  else if (t.id === "floor") { payFloor = payFloor ? 0 : 95000; render(); }
  else if (t.id === "unlisted") { showUnlisted = !showUnlisted; render(); }
  else if (t.id === "more") { limit += 60; render(); }
  else if (t.dataset.set) t.closest(".job").dataset.ids.split(",").forEach((id) => setStatus(id, t.dataset.set));
});
document.addEventListener("change", (e) => { if (e.target.matches("[data-status]")) e.target.closest(".job").dataset.ids.split(",").forEach((id) => setStatus(id, e.target.value)); });
document.addEventListener("focusout", async (e) => {
  if (!e.target.matches("[data-notes]")) return;
  const id = e.target.closest(".job").dataset.id, a = apps.get(id); if (!a || (a.notes || "") === e.target.value) return;
  a.notes = e.target.value; a.updated_at = new Date().toISOString();
  const { error } = await sb.from("applications").update({ notes: a.notes, updated_at: a.updated_at }).eq("posting_id", id);
  alertBar(error ? "Couldn't save notes. Try again." : "Notes saved");
});
$("#sort").addEventListener("change", (e) => { sortBy = e.target.value; render(); });
$("#q").addEventListener("input", (e) => { q = e.target.value.trim().toLowerCase(); render(); });
$("#signout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

function showLive() {
  const t = lastRun ? `Live · feed checked ${ago(lastRun.finished_at || lastRun.started_at)}` : "Live";
  $("#liveText").textContent = t;
}

async function loadAll() {
  const [{ data: ps, error: e1 }, { data: as }, { data: rs }] = await Promise.all([
    sb.from("postings").select("id,company,title,location,url,lane,pay,description,first_seen_at,last_checked_at,is_open,closed_at,close_reason,score,fit,matched,gaps,why,pay_min_yr,pay_max_yr")
      .or("is_open.eq.true,closed_at.gt." + new Date(Date.now() - 60 * 864e5).toISOString()).order("score", { ascending: false }).limit(2000),
    sb.from("applications").select("*"),
    sb.from("runs").select("*").eq("kind", "ingest").order("started_at", { ascending: false }).limit(1),
  ]);
  if (e1) { alertBar("Couldn't load jobs. This account may not have access."); return; }
  postings = new Map((ps || []).map((p) => [p.id, p])); apps = new Map((as || []).map((a) => [a.posting_id, a])); lastRun = rs?.[0] || null;
  render(); showLive();
}

function subscribe() {
  sb.channel("jobhunt")
    .on("postgres_changes", { event: "*", schema: "public", table: "postings" }, ({ eventType, new: n, old }) => {
      if (eventType === "DELETE") postings.delete(old.id);
      else { if (eventType === "INSERT") { fresh.add(n.id); setTimeout(() => fresh.delete(n.id), 3000); } postings.set(n.id, { ...postings.get(n.id), ...n }); }
      render();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "applications" }, ({ eventType, new: n, old }) => {
      if (eventType === "DELETE") apps.delete(old.posting_id); else apps.set(n.posting_id, n);
      if (!document.activeElement?.matches?.("textarea")) render();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "runs" }, ({ new: n }) => { if (n.kind === "ingest") { lastRun = n; showLive(); } })
    .subscribe((s) => { $("#dot").classList.toggle("on", s === "SUBSCRIBED"); if (s !== "SUBSCRIBED") $("#liveText").textContent = "Reconnecting…"; else showLive(); });
  setInterval(showLive, 60000);
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithOtp({ email: $("#email").value.trim(), options: { emailRedirectTo: location.href.split("#")[0] } });
  $("#loginMsg").textContent = error ? `Couldn't send the link: ${error.message}` : "Check your email for the sign-in link. You can close this tab.";
});

const { data: { session } } = await sb.auth.getSession();
let booted = !!session;
sb.auth.onAuthStateChange((evt) => { if (evt === "SIGNED_IN" && !booted) { booted = true; location.reload(); } });
if (!session) { $("#login").hidden = false; }
else { $("#main").hidden = false; await loadAll(); subscribe(); }
</script>
</body>
</html>
